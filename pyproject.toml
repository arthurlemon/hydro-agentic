[project]
name = "hydro-agentic"
version = "0.1.0"
description = "Investigation agentique d’actifs électriques — démonstration synthétique"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "httpx>=0.28,<1",
    "mcp>=1.20,<2",
    "psycopg[binary]>=3.2,<4",
    "azure-ai-projects>=2.3,<3",
    "azure-identity>=1.25,<2",
    "aiohttp>=3.12,<4",
    "azure-search-documents>=11.6,<12",
]

[project.scripts]
hydro-agent = "hydro_agent.cli:main"
hydro-mcp = "hydro_agent.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/hydro_agent"]
