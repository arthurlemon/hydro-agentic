name: hydro-agentic

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hydro
      POSTGRES_PASSWORD: hydro-local
      POSTGRES_DB: hydro
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydro -d hydro"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
